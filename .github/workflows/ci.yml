name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pmii_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://test:test@localhost:3306/pmii_test

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run seed
        env:
          DATABASE_URL: mysql://test:test@localhost:3306/pmii_test
          AUTH_SECRET: test-secret

      - run: npm test
        env:
          DATABASE_URL: mysql://test:test@localhost:3306/pmii_test
          AUTH_SECRET: test-secret
